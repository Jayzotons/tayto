<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification</title>

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        #stage {
            color: #666;
            margin-bottom: 25px;
        }

        #captcha {
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #status {
            margin: 15px 0;
            color: #555;
        }

        #continue {
            display: none;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #continue:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
        }

        #result img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <!-- VERIFICATION AREA -->
    <div id="verification">

        <h1>Please verify you're human</h1>

        <div id="stage">
            Verification 1 of 10
        </div>

        <div id="captcha"></div>

        <div id="status">
            Please complete the verification.
        </div>

        <button id="continue">
            Continue
        </button>

    </div>


    <!-- IMAGE AREA -->
    <div id="result">

        <h1>Hey its me, its taylority</h1>

        <p>Ask me powerscaling!</p>

        <!-- CHANGE THIS TO YOUR IMAGE -->
        <img src="taylority.jpg" alt="Image">

    </div>

</div>


<script>

    // ==========================================
    // PUT YOUR CLOUDFLARE SITE KEY HERE
    // ==========================================

    const SITE_KEY = "0x4AAAAAAFEUO428NDwDkRXy";


    let currentStage = 1;
    let verified = false;
    let waiting = false;


    // ==========================================
    // START A NEW TURNSTILE
    // ==========================================

    function startCaptcha() {

        const captcha = document.getElementById("captcha");

        const continueButton =
            document.getElementById("continue");

        const status =
            document.getElementById("status");

        verified = false;
        waiting = false;

        continueButton.style.display = "none";

        status.textContent =
            "Please complete the verification.";

        captcha.innerHTML = "";


        turnstile.render(captcha, {

            sitekey: SITE_KEY,

            callback: function(token) {

                verified = true;

                status.textContent =
                    "Verification successful.";

                /*
                 * Wait a little before allowing
                 * the Continue button.
                 */

                setTimeout(function() {

                    continueButton.style.display =
                        "inline-block";

                }, 1500);

            },

            "error-callback": function() {

                status.textContent =
                    "Verification failed. Please try again.";

            },

            "expired-callback": function() {

                status.textContent =
                    "Verification expired. Please try again.";

            }

        });

    }


    // ==========================================
    // CONTINUE BUTTON
    // ==========================================

    document
        .getElementById("continue")
        .addEventListener("click", function() {

            if (!verified || waiting) {
                return;
            }

            waiting = true;


            // ----------------------------------
            // Five stages completed
            // ----------------------------------

            if (currentStage >= 5) {

                document.getElementById("verification")
                    .style.display = "none";

                document.getElementById("result")
                    .style.display = "block";

                return;
            }


            // ----------------------------------
            // Move to next stage
            // ----------------------------------

            currentStage++;

            document.getElementById("stage")
                .textContent =
                "Verification " +
                currentStage +
                " of 10";


            /*
             * Small delay before loading
             * the next CAPTCHA.
             */

            document.getElementById("continue")
                .style.display = "none";

            document.getElementById("status")
                .textContent =
                "Loading next verification...";


            setTimeout(function() {

                waiting = false;

                startCaptcha();

            }, 1200);

        });


    // ==========================================
    // START FIRST STAGE
    // ==========================================

    window.addEventListener("load", function() {

        setTimeout(function() {

            startCaptcha();

        }, 1000);

    });

</script>

</body>
</html>
