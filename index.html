<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please verify</title>

    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        #progress {
            color: #666;
            margin-bottom: 25px;
        }

        #captcha-container {
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #message {
            margin-top: 15px;
            color: #555;
        }

        #image-result {
            display: none;
        }

        #image-result img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div id="verification">

        <h1>Please verify you're human</h1>

        <div id="progress">
            Verification 1 of 5
        </div>

        <div id="captcha-container"></div>

        <div id="message">
            Complete the verification above to continue.
        </div>

    </div>


    <div id="image-result">

        <h1>Verification complete!</h1>

        <p>Here's your image:</p>

        <img
            src="Screenshot_20260925-180639.png"
            alt="Image"
        >

    </div>

</div>


<script>

    /*
     * PUT YOUR CLOUDFLARE TURNSTILE SITE KEY HERE
     */
    const SITE_KEY = "0x4AAAAAAFEUO428NDwDkRXy";


    let currentStep = 1;


    function createCaptcha() {

        const container = document.getElementById("captcha-container");

        // Remove the previous CAPTCHA
        container.innerHTML = "";

        // Create a new CAPTCHA
        turnstile.render(container, {

            sitekey: SITE_KEY,

            callback: function(token) {

                // CAPTCHA completed successfully
                nextStep();

            },

            "error-callback": function() {

                document.getElementById("message").textContent =
                    "Something went wrong. Please try again.";

            },

            "expired-callback": function() {

                document.getElementById("message").textContent =
                    "The verification expired. Please complete it again.";

            }

        });

    }


    function nextStep() {

        if (currentStep < 5) {

            currentStep++;

            document.getElementById("progress").textContent =
                "Verification " + currentStep + " of 5";

            document.getElementById("message").textContent =
                "Complete the verification above to continue.";

            // Give the previous CAPTCHA a moment to disappear
            setTimeout(function() {
                createCaptcha();
            }, 500);

        } else {

            // All five completed
            document.getElementById("verification").style.display = "none";

            document.getElementById("image-result").style.display = "block";

        }

    }


    // Wait until Turnstile has loaded
    window.addEventListener("load", function() {

        setTimeout(function() {
            createCaptcha();
        }, 1000);

    });

</script>

</body>
</html>
